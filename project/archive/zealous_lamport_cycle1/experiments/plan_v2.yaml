# plan_v2 — written 2026-11-24 (cycle 1) BEFORE any held-out (test-project) run.
# Changes vs plan_v1 (reasons in state/decisions.md, 2026-11-24):
#   1. NEW BASELINE odasc (ODaSC-style, Song et al. IJCNN 2022, batch adaptation), tuned on dev over the same
#      W grid (5 configs, delta=0.9, k=50, pool=5000) -> experiment E0b (dev only).
#   2. LAW config for E1-E3 = best of its 4 E0 variants by mean dev G-mean (was: pre-specified lagakos+model).
#      Baselines likewise use their best dev config. Ties broken by plan_v1 order.
#   3. Primary comparison: law vs the best non-oracle baseline on dev among {nowait, wait(W*), orb(W*), odasc(W*)};
#      Holm family = law vs each of the four.
#   Everything else (data, split, learner, metrics, seeds, statistics, leakage checks) unchanged from plan_v1.
version: 2
inherits: plan_v1.yaml
methods_added:
  odasc: "wait labels; at labelling time each clean commit gets alpha0 = 1 - mean label of its 50 nearest recent labelled commits (standardised log features, pool = 5000 most recent labelled); alpha0 < 0.9 -> counted as both class 0 and class 1"
experiments:
  E0_dev_tuning:   {as plan_v1}
  E0b_odasc_dev:   {projects: dev, seeds: explore, runs: "odasc x5 W", est_cpu_h: 0.3, priority: 11}
  E1_main_confirm: {projects: test, seeds: confirm, methods: [nowait, "wait(W*)", "orb(W*)", "odasc(W*)", "law(best dev variant)", oracle], est_cpu_h: 1.0, priority: 20}
  E2_ablation:     {projects: test, seeds: confirm, variants: "the other 3 LAW variants", est_cpu_h: 0.5, priority: 30}
  E3_robustness:   {projects: test, seeds: confirm, conditions: ["delay_scale=2 for nowait/wait/orb/odasc/law", "label-noise diagnostics"], est_cpu_h: 1.0, priority: 40}
selection_rule: "frozen_config.json written by scripts/freeze_config.py from dev (E0+E0b) results only"
